# 工作台前端 nginx 配置（#3158）
# 由 web/Dockerfile 拷到 /etc/nginx/conf.d/default.conf。
# 本文件只含 server 块（http 块与 mime.types 由 nginx:alpine 主配置提供）。
server {
    # 非 root 运行：只听 8080，部署层再映射到 80（见 README）
    listen       8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # gzip：文本类响应压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 存活探活：Dockerfile HEALTHCHECK 调用此接口
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # SPA 路由回退：未知路径一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
